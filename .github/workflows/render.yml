name: Render models

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install --yes openscad
      - name: Render models
        run: make
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: rendered-models
          path: build/*.stl
